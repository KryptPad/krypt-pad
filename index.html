<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/safe.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Vuetify injects theme styles inline; ws://localhost is the Vite dev server's HMR socket -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws://localhost:*; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Krypt Pad</title>
    <!-- Splash screen styles. These are inline so the splash paints before any script or stylesheet has loaded. -->
    <style>
      html,
      body {
        margin: 0;
        background-color: #121212;
      }

      #splash {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        background-color: #121212;
        color: rgba(255, 255, 255, 0.87);
        font-family: Roboto, 'Segoe UI', Helvetica, Arial, sans-serif;
        transition: opacity 300ms ease-out;
        /* Lets the window be dragged while the app is loading */
        -webkit-app-region: drag;
        user-select: none;
      }

      #splash.splash-hidden {
        opacity: 0;
        pointer-events: none;
      }

      #splash img {
        width: 8rem;
        height: 8rem;
        animation: splash-pulse 1.6s ease-in-out infinite;
      }

      #splash .splash-title {
        font-size: 1.5rem;
        font-weight: 300;
        letter-spacing: 0.1em;
      }

      #splash .splash-bar {
        position: relative;
        width: 10rem;
        height: 3px;
        overflow: hidden;
        border-radius: 3px;
        background-color: rgba(255, 255, 255, 0.12);
      }

      #splash .splash-bar::after {
        content: '';
        position: absolute;
        top: 0;
        left: -40%;
        width: 40%;
        height: 100%;
        border-radius: 3px;
        background-color: rgba(255, 255, 255, 0.6);
        animation: splash-slide 1.2s ease-in-out infinite;
      }

      @keyframes splash-pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(0.94);
          opacity: 0.8;
        }
      }

      @keyframes splash-slide {
        from {
          left: -40%;
        }
        to {
          left: 100%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #splash img,
        #splash .splash-bar::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- Shown while the app loads, then faded out and removed once it has mounted -->
    <div id="splash" role="status" aria-label="Loading Krypt Pad">
      <img src="./src/assets/safe.svg" alt="" />
      <div class="splash-title">Krypt Pad</div>
      <div class="splash-bar"></div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
