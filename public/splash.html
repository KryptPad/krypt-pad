<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The splash window runs no script and loads nothing but its logo -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'" />
    <title>Krypt Pad</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background-color: #121212;
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        color: rgba(255, 255, 255, 0.87);
        font-family: Roboto, 'Segoe UI', Helvetica, Arial, sans-serif;
        /* The window is frameless, so let it be dragged from anywhere */
        -webkit-app-region: drag;
        user-select: none;
        cursor: default;
      }

      img {
        width: 10rem;
        height: 10rem;
      }

      .title {
        font-size: 1.5rem;
        font-weight: 300;
        letter-spacing: 0.1em;
      }

      .bar {
        position: relative;
        width: 20rem;
        height: 3px;
        overflow: hidden;
        border-radius: 3px;
        background-color: rgba(255, 255, 255, 0.12);
      }

      .bar::after {
        content: '';
        position: absolute;
        top: 0;
        left: -40%;
        width: 40%;
        height: 100%;
        border-radius: 3px;
        background-color: rgba(255, 255, 255, 0.6);
        animation: slide 1.2s ease-in-out infinite;
      }

      @keyframes slide {
        from {
          left: -40%;
        }
        to {
          left: 100%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .bar::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <img src="safe.png" alt="" />
    <div class="title">Krypt Pad is starting...</div>
    <div class="bar" role="status" aria-label="Loading"></div>
  </body>
</html>
